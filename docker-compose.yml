# =============================================================================
# Seedance-Hub 一键编排文件
# 漫剧团队 Seedance 智能路由 + 本地/云端协同 基础设施
#
# 包含服务：
#   1. new-api          —— 智能路由网关（多渠道/权重/计费）
#   2. nocodb           —— 低代码协作平台（项目/分镜/成本管理）
#   3. minio            —— S3 兼容对象存储（素材库/成片归档）
#   4. mysql-newapi     —— New-API 数据库
#   5. mysql-nocodb     —— NocoDB 数据库
#   6. seedance-adapter —— Seedance 异步任务适配器
#   7. submit-tool      —— 分镜提交工具（标准+ComfyUI模式）
#   8. cost-sync        —— 计费同步（loop 守护）
#   9. cost-dashboard   —— 成本看板
#  10. admin-tool       —— 管理员渠道配置
#  11. comfyui          —— 可选 profile：同机 ComfyUI 专业工作台
#
# 启动：  docker compose up -d
# 停止：  docker compose down
# 查看日志：docker compose logs -f new-api
# =============================================================================

# 可复用片段：日志轮转（防 json-file 无限增长写爆磁盘）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # New-API 智能路由网关
  # 文档：https://github.com/QuantumNous/new-api
  # 默认账号：root / 123456（首次登录后请立即改密）
  # ---------------------------------------------------------------------------
  new-api:
    image: calciumion/new-api:v0.6.8.2
    container_name: seedance-newapi
    restart: always
    logging: *default-logging
    mem_limit: 1g
    depends_on:
      mysql-newapi:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SQL_DSN: "root:${NEWAPI_MYSQL_ROOT_PASSWORD}@tcp(mysql-newapi:3306)/newapi"
      REDIS_CONN_STRING: ""            # 单机可不配 Redis；高并发再启用
      SESSION_SECRET: "${NEWAPI_SESSION_SECRET}"
      # 关闭注册，避免外网暴露后被刷号
      REGISTER_ENABLED: "false"
      # 初始 root 密码（仅首次生效，建议登录后修改）
      INITIAL_ROOT_TOKEN: "${NEWAPI_ROOT_TOKEN}"
    volumes:
      - ./data/newapi/logs:/data/logs
      - ./data/newapi/files:/data/files
    ports:
      - "127.0.0.1:${NEWAPI_PORT}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # New-API 专用 MySQL
  # ---------------------------------------------------------------------------
  mysql-newapi:
    image: mysql:8.0.46
    container_name: seedance-mysql-newapi
    restart: always
    logging: *default-logging
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${NEWAPI_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "newapi"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/newapi/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${NEWAPI_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # NocoDB 低代码协作平台
  # 文档：https://docs.nocodb.com/
  # 首次访问会引导创建管理员账号
  # ---------------------------------------------------------------------------
  nocodb:
    image: nocodb/nocodb:2026.08.0
    container_name: seedance-nocodb
    restart: always
    logging: *default-logging
    mem_limit: 2g
    depends_on:
      mysql-nocodb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NC_DB: "mysql2://mysql-nocodb:3306?u=nocodb&p=${NOCODB_MYSQL_PASSWORD}&d=nocodb"
      NC_AUTH_JWT_SECRET: "${NOCODB_JWT_SECRET}"
      # 关闭公开注册
      NC_INVITE_ONLY_SIGNUP: "true"
      # 程序内需要回填视频链接时调用 New-API / MinIO 的地址（容器内互通）
      NEWAPI_BASE_URL: "http://new-api:3000"
      MINIO_ENDPOINT: "http://minio:9000"
    volumes:
      - ./data/nocodb/app:/usr/app/data
    ports:
      - "127.0.0.1:${NOCODB_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # NocoDB 专用 MySQL
  # ---------------------------------------------------------------------------
  mysql-nocodb:
    image: mysql:8.0.46
    container_name: seedance-mysql-nocodb
    restart: always
    logging: *default-logging
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${NOCODB_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "nocodb"
      MYSQL_USER: "nocodb"
      MYSQL_PASSWORD: "${NOCODB_MYSQL_PASSWORD}"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/nocodb/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${NOCODB_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO 对象存储（素材库 / 成片归档）
  # 控制台：http://<ip>:${MINIO_CONSOLE_PORT}  用户名/密码见 .env
  # API：   http://<ip>:${MINIO_PORT}
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: seedance-minio
    restart: always
    logging: *default-logging
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      # 用 HTTP readiness 端点，不依赖 mc 别名配置
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MinIO 初始化任务：创建 bucket（仅运行一次）
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: seedance-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_APP_USER: "${MINIO_APP_USER:-seedance-app}"
      MINIO_APP_PASSWORD: "${MINIO_APP_PASSWORD:-}"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/projects   || true;
      mc mb -p local/storyboards || true;
      mc mb -p local/outputs    || true;
      mc mb -p local/assets     || true;
      mc anonymous set none local/projects || true;
      mc anonymous set none local/storyboards || true;
      mc anonymous set none local/outputs || true;
      mc anonymous set none local/assets || true;
      if [ -n \"$${MINIO_APP_PASSWORD}\" ]; then
        cat > /tmp/mangarouter-app.json <<'POLICY'
      {\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::storyboards\",\"arn:aws:s3:::storyboards/*\",\"arn:aws:s3:::outputs\",\"arn:aws:s3:::outputs/*\",\"arn:aws:s3:::projects\",\"arn:aws:s3:::projects/*\",\"arn:aws:s3:::assets\",\"arn:aws:s3:::assets/*\"]}]}
      POLICY
        mc admin policy create local mangarouter-app /tmp/mangarouter-app.json || true;
        mc admin user add local $${MINIO_APP_USER} $${MINIO_APP_PASSWORD} || true;
        mc admin policy attach local mangarouter-app --user $${MINIO_APP_USER} || true;
        echo \"App user ready: $${MINIO_APP_USER} (buckets RW)\";
      else
        echo 'MINIO_APP_PASSWORD empty — skip app user (submit still may use root; not recommended)';
      fi
      echo 'Buckets created (private): projects, storyboards, outputs, assets';
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # 计费同步：每天凌晨把 New-API 消费日志汇总写入 NocoDB Costs 表
  # 内置 cron，默认 01:05 跑昨天数据。可改 COST_SYNC_CRON / COST_SYNC_ARGS
  # 也可手动触发：docker compose run --rm cost-sync python sync.py --days 7
  # ---------------------------------------------------------------------------
  cost-sync:
    build: ./cost-sync
    image: seedance-cost-sync
    container_name: seedance-cost-sync
    restart: always
    depends_on:
      new-api:
        condition: service_healthy
      nocodb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 容器内用服务名访问（同一 docker 网络）
      COST_NEWAPI_BASE_URL: "http://new-api:3000"
      COST_NEWAPI_TOKEN: "${COST_NEWAPI_TOKEN}"
      COST_NOCODB_BASE_URL: "http://nocodb:8080"
      COST_NOCODB_TOKEN: "${COST_NOCODB_TOKEN}"
      COST_NOCODB_TABLE_ID: "${COST_NOCODB_TABLE_ID}"
      # 同步间隔（小时）；默认 24 = 每天一次。如想每 6 小时：COST_SYNC_INTERVAL_HOURS=6
      COST_SYNC_INTERVAL_HOURS: "${COST_SYNC_INTERVAL_HOURS:-24}"
      COST_SYNC_ARGS: "${COST_SYNC_ARGS:---days 1}"

  # ---------------------------------------------------------------------------
  # 成本看板：从 NocoDB Costs 表读数据做可视化
  # 访问：http://<ip>:${DASH_PORT}
  # ---------------------------------------------------------------------------
  cost-dashboard:
    build: ./cost-dashboard
    image: seedance-cost-dashboard
    container_name: seedance-cost-dashboard
    restart: always
    depends_on:
      nocodb:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DASH_NOCODB_BASE_URL: "http://nocodb:8080"
      DASH_NOCODB_TOKEN: "${COST_NOCODB_TOKEN}"
      DASH_COSTS_TABLE_ID: "${COST_NOCODB_TABLE_ID}"
    ports:
      - "127.0.0.1:${DASH_PORT}:18502"

  # ---------------------------------------------------------------------------
  # Seedance 适配器：把火山方舟异步任务包装成统一接口
  # New-API 若未原生支持 Seedance，把渠道 Base URL 指向本服务
  # 访问：http://<ip>:${ADAPTER_PORT}
  # ---------------------------------------------------------------------------
  seedance-adapter:
    build: ./seedance-adapter
    image: seedance-adapter
    container_name: seedance-adapter
    restart: always
    environment:
      TZ: Asia/Shanghai
      VOLC_API_KEY: "${VOLC_API_KEY}"
      VOLC_BASE_URL: "${VOLC_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      ADAPTER_API_TOKEN: "${ADAPTER_API_TOKEN}"
      ADAPTER_REQUIRE_AUTH: "${ADAPTER_REQUIRE_AUTH:-true}"
      ADAPTER_PORT: "18008"
    ports:
      - "127.0.0.1:${ADAPTER_PORT}:18008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:18008/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 分镜提交工具：标准模式 + NocoDB 批量 + ComfyUI 专业模式
  # 访问：经 Caddy submit.your.domain → 127.0.0.1:${SUBMIT_TOOL_PORT}
  # 路由：submit → New-API →（渠道）seedance-adapter → 方舟
  # ---------------------------------------------------------------------------
  submit-tool:
    build: ./submit-tool
    image: seedance-submit-tool
    container_name: seedance-submit-tool
    restart: always
    depends_on:
      new-api:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SUBMIT_NEWAPI_BASE_URL: "http://new-api:3000"
      SUBMIT_NEWAPI_TOKEN: "${SUBMIT_NEWAPI_TOKEN}"
      SUBMIT_TOKEN_DRAFT: "${SUBMIT_TOKEN_DRAFT:-}"
      SUBMIT_TOKEN_STANDARD: "${SUBMIT_TOKEN_STANDARD:-}"
      SUBMIT_TOKEN_FINAL: "${SUBMIT_TOKEN_FINAL:-}"
      NOCODB_BASE_URL: "http://nocodb:8080"
      NOCODB_TOKEN: "${NOCODB_TOKEN}"
      STORYBOARDS_TABLE_ID: "${STORYBOARDS_TABLE_ID:-}"
      SUBMIT_MINIO_ENDPOINT: "minio:9000"
      SUBMIT_MINIO_ACCESS_KEY: "${MINIO_APP_USER:-seedance-app}"
      SUBMIT_MINIO_SECRET_KEY: "${MINIO_APP_PASSWORD}"
      SUBMIT_MINIO_SECURE: "false"
      SUBMIT_MINIO_PUBLIC_ENDPOINT: "${SUBMIT_MINIO_PUBLIC_ENDPOINT}"
      SUBMIT_MINIO_PUBLIC_SECURE: "${SUBMIT_MINIO_PUBLIC_SECURE:-true}"
      SUBMIT_MINIO_PRESIGN_SECONDS: "${SUBMIT_MINIO_PRESIGN_SECONDS:-7200}"
      COMFYUI_BASE_URL: "${COMFYUI_BASE_URL:-}"
      COMFYUI_PUBLIC_BASE_URL: "${COMFYUI_PUBLIC_BASE_URL:-}"
      REVIEW_WEBHOOK_URL: "${REVIEW_WEBHOOK_URL:-}"
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-15}"
      WORKER_ACTIVE_HOURS: "${WORKER_ACTIVE_HOURS:-}"
      SUBMIT_CACHE_ENABLED: "${SUBMIT_CACHE_ENABLED:-true}"
    ports:
      - "127.0.0.1:${SUBMIT_TOOL_PORT}:18501"

  # 后台补状态 worker（关浏览器后仍回填 NocoDB / 归档）
  submit-worker:
    build: ./submit-tool
    image: seedance-submit-tool
    container_name: seedance-submit-worker
    restart: always
    depends_on:
      new-api:
        condition: service_healthy
      nocodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SUBMIT_NEWAPI_BASE_URL: "http://new-api:3000"
      SUBMIT_NEWAPI_TOKEN: "${SUBMIT_NEWAPI_TOKEN}"
      SUBMIT_TOKEN_DRAFT: "${SUBMIT_TOKEN_DRAFT:-}"
      SUBMIT_TOKEN_STANDARD: "${SUBMIT_TOKEN_STANDARD:-}"
      SUBMIT_TOKEN_FINAL: "${SUBMIT_TOKEN_FINAL:-}"
      NOCODB_BASE_URL: "http://nocodb:8080"
      NOCODB_TOKEN: "${NOCODB_TOKEN}"
      STORYBOARDS_TABLE_ID: "${STORYBOARDS_TABLE_ID:-}"
      SUBMIT_MINIO_ENDPOINT: "minio:9000"
      SUBMIT_MINIO_ACCESS_KEY: "${MINIO_APP_USER:-seedance-app}"
      SUBMIT_MINIO_SECRET_KEY: "${MINIO_APP_PASSWORD}"
      SUBMIT_MINIO_SECURE: "false"
      SUBMIT_MINIO_PUBLIC_ENDPOINT: "${SUBMIT_MINIO_PUBLIC_ENDPOINT}"
      SUBMIT_MINIO_PUBLIC_SECURE: "${SUBMIT_MINIO_PUBLIC_SECURE:-true}"
      SUBMIT_MINIO_PRESIGN_SECONDS: "${SUBMIT_MINIO_PRESIGN_SECONDS:-7200}"
      REVIEW_WEBHOOK_URL: "${REVIEW_WEBHOOK_URL:-}"
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-15}"
      WORKER_ACTIVE_HOURS: "${WORKER_ACTIVE_HOURS:-}"
      COMFYUI_BASE_URL: "${COMFYUI_BASE_URL:-}"
      COMFYUI_PUBLIC_BASE_URL: "${COMFYUI_PUBLIC_BASE_URL:-}"
    command: ["python", "worker.py"]

  # ---------------------------------------------------------------------------
  # ComfyUI 专业工作台（同机 CPU；Seedance 走云端 API）
  # 启用：COMPOSE_PROFILES=comfyui docker compose up -d comfyui
  # 访问：Caddy comfy.your.domain → 127.0.0.1:18188（必须 basicauth）
  # submit-tool 内网：COMFYUI_BASE_URL=http://comfyui:8188
  # ---------------------------------------------------------------------------
  comfyui:
    profiles: ["comfyui"]
    build: ./comfyui
    image: seedance-comfyui
    container_name: seedance-comfyui
    restart: always
    logging: *default-logging
    mem_limit: 4g
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/comfyui/input:/opt/ComfyUI/input
      - ./data/comfyui/output:/opt/ComfyUI/output
      - ./data/comfyui/user:/opt/ComfyUI/user
      - ./data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
    ports:
      - "127.0.0.1:${COMFYUI_PORT:-18188}:8188"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # 管理员配置页：New-API 渠道/令牌薄封装（密钥仍存 New-API）
  # 访问：经 Caddy admin.your.domain（必须 basicauth，用户与 team 分离）
  # ---------------------------------------------------------------------------
  admin-tool:
    build: ./admin-tool
    image: seedance-admin-tool
    container_name: seedance-admin-tool
    restart: always
    depends_on:
      new-api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      ADMIN_NEWAPI_BASE_URL: "http://new-api:3000"
      ADMIN_NEWAPI_TOKEN: "${ADMIN_NEWAPI_TOKEN}"
      ADMIN_NEWAPI_USER_ID: "${ADMIN_NEWAPI_USER_ID:-1}"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-18503}:18503"

# =============================================================================
# 网络：所有服务在同一自定义网络内，用服务名（如 new-api/nocodb/minio）互通。
# 显式声明便于将来按安全边界分网（如把 mysql 隔离到 backend 不暴露给前端服务）。
# =============================================================================
networks:
  default:
    name: seedance-net
    driver: bridge
